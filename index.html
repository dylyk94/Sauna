    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sauna: {
                base: '#111A19',      /* Noir De Vigne (Deep Black-Green) */
                soft: '#192422',      /* Slightly Lighter Noir */
                sage: '#284139',      /* Emerald Green (Sections/Cards) */
                card: '#284139',      /* Emerald Green */
                primary: '#B86830',   /* Egyptian Earth (Copper/Orange) */
                primaryHover: '#CD7A40', /* Lighter Copper */
                text: '#F2F4F3',      /* Off-White Text */
                muted: '#9CA3AF'      /* Muted Grey */
              }
            },
            fontFamily: {
              sans: ['Open Sans', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #111A19;
        color: #F2F4F3;
        scroll-behavior: smooth;
      }
      .glass-panel {
        background: rgba(17, 26, 25, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #111A19;
      }
      ::-webkit-scrollbar-thumb {
        background: #284139;
        border-radius: 4px;
        border: 1px solid #111A19;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B86830;
      }
    </style>
